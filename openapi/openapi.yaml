openapi: 3.0.3
info:
  title: Tang Kinh Cac API
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /auth/login:
    post:
      tags:
        - Authentication
      summary: Log in and issue a personal access token
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: reader@example.com
              password: correct-horse-battery-staple
              device_name: Pixel 9
      responses:
        '200':
          description: Login successful
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                data:
                  token: 1|plain-text-token-returned-once
                  token_type: Bearer
                  user:
                    id: 1
                    full_name: Nguyen Van An
                    username: reader.one
                    birth_date: '1990-06-15'
                    phone_number: '+84901234567'
                    email: reader@example.com
                    role: reader
        '401':
          description: Invalid credentials
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INVALID_CREDENTIALS
                  message: The provided credentials are invalid.
                  request_id: 01JD0EXAMPLE00000000000000
        '422':
          description: Validation failed
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: The request contains invalid fields.
                  fields:
                    email:
                      - The email field must be a valid email address.
                  request_id: 01JD0EXAMPLE00000000000000
        '429':
          description: Too many failed login attempts
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: TOO_MANY_REQUESTS
                  message: Too many requests were made.
                  request_id: 01JD0EXAMPLE00000000000000
  /auth/me:
    get:
      tags:
        - Authentication
      summary: Get the authenticated user
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The authenticated user.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
              example:
                data:
                  id: 1
                  full_name: Nguyen Van An
                  username: reader.one
                  birth_date: '1990-06-15'
                  phone_number: '+84901234567'
                  email: reader@example.com
                  role: reader
        '401':
          description: The access token is missing, invalid, or revoked.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: UNAUTHENTICATED
                  message: Authentication is required.
                  request_id: 01JD0EXAMPLE00000000000000
  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Revoke the current access token
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        '204':
          description: The current access token was revoked.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
        '401':
          description: The access token is missing, invalid, or revoked.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: UNAUTHENTICATED
                  message: Authentication is required.
                  request_id: 01JD0EXAMPLE00000000000000
  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register a reader account
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              full_name: Nguyen Van An
              username: reader.one
              birth_date: '1990-06-15'
              phone_number: '+84901234567'
              email: reader@example.com
              password: correct-horse-battery-staple
              password_confirmation: correct-horse-battery-staple
      responses:
        '201':
          description: The reader account was created without authenticating it.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
              example:
                data:
                  user:
                    id: 1
                    full_name: Nguyen Van An
                    username: reader.one
                    birth_date: '1990-06-15'
                    phone_number: '+84901234567'
                    email: reader@example.com
                    role: reader
        '409':
          description: The normalized email address or username is already used.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                emailAlreadyUsed:
                  value:
                    error:
                      code: EMAIL_ALREADY_USED
                      message: The email address has already been used.
                      request_id: 01JD0EXAMPLE00000000000000
                usernameAlreadyUsed:
                  value:
                    error:
                      code: USERNAME_ALREADY_USED
                      message: The username has already been used.
                      request_id: 01JD0EXAMPLE00000000000000
        '422':
          description: One or more registration fields are invalid.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: The request contains invalid fields.
                  fields:
                    email:
                      - The email field must be a valid email address.
                  request_id: 01JD0EXAMPLE00000000000000
        '429':
          description: Too many registration attempts were made.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: TOO_MANY_REQUESTS
                  message: Too many requests were made.
                  request_id: 01JD0EXAMPLE00000000000000
  /books:
    get:
      tags:
        - Catalog
      summary: List published catalog books
      operationId: listBooks
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 200
          description: Accent-insensitive search across catalog metadata.
        - name: genre
          in: query
          schema:
            type: string
            maxLength: 255
          description: Genre slug.
        - name: country
          in: query
          schema:
            type: string
            maxLength: 100
          description: Case-insensitive stored country value.
        - name: access_level
          in: query
          schema:
            type: string
            enum:
              - free
              - vip
        - name: sort
          in: query
          schema:
            type: string
            default: title
            enum:
              - title
              - newest
              - rating
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Published books matching the requested filters.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookCollectionResponse'
              example:
                data:
                  - id: 1
                    slug: truyen-kieu
                    title: Truyện Kiều
                    author:
                      id: 1
                      name: Nguyễn Du
                    country: Vietnam
                    access_level: free
                    status: published
                    average_rating: '4.90'
                    review_count: 1200
                    cover_url: null
                    has_epub: false
                    has_audiobook: false
                meta:
                  current_page: 1
                  per_page: 20
                  total: 1
                  last_page: 1
        '401':
          description: The access token is missing, invalid, or revoked.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: UNAUTHENTICATED
                  message: Authentication is required.
                  request_id: 01JD0EXAMPLE00000000000000
        '422':
          description: One or more query parameters are invalid.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: The request contains invalid fields.
                  fields:
                    per_page:
                      - The per page field must be between 1 and 50.
                  request_id: 01JD0EXAMPLE00000000000000
  /books/{book}:
    get:
      tags:
        - Catalog
      summary: Get a published catalog book
      operationId: getBook
      security:
        - bearerAuth: []
      parameters:
        - name: book
          in: path
          required: true
          description: Numeric book identifier or unique slug.
          schema:
            type: string
      responses:
        '200':
          description: Full metadata for the published book.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookDetailResponse'
              example:
                data:
                  id: 1
                  slug: truyen-kieu
                  title: Truyện Kiều
                  original_title: Đoạn trường tân thanh
                  alternative_titles:
                    - Kim Vân Kiều truyện
                  author:
                    id: 1
                    name: Nguyễn Du
                    original_name: Tố Như
                  country: Vietnam
                  original_language: Vietnamese
                  publication_period: Early 19th century
                  genres:
                    - id: 1
                      slug: van-hoc-co-dien
                      name: Văn học cổ điển
                  structure: 3,254 lines of lục bát verse
                  historical_setting: A society shaped by family duty.
                  synopsis: A gifted young woman protects her family.
                  keywords:
                    - thân phận
                  access_level: free
                  status: published
                  average_rating: '4.90'
                  review_count: 1200
                  cover_url: null
                  has_epub: false
                  has_audiobook: false
                  available_content_types: []
        '401':
          description: The access token is missing, invalid, or revoked.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: UNAUTHENTICATED
                  message: Authentication is required.
                  request_id: 01JD0EXAMPLE00000000000000
        '404':
          description: The book is missing or is not published.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: BOOK_NOT_FOUND
                  message: The requested book was not found.
                  request_id: 01JD0EXAMPLE00000000000000
  /books/{book}/epub:
    get:
      tags:
        - EPUB
      summary: Get an authorized EPUB descriptor
      operationId: getEpubDescriptor
      security:
        - bearerAuth: []
      parameters:
        - name: book
          in: path
          required: true
          description: Numeric book identifier or unique slug.
          schema:
            type: string
      responses:
        '200':
          description: Metadata and a short-lived signed download URL for the active EPUB.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EpubDescriptorResponse'
              example:
                data:
                  file_id: 10
                  book_id: 1
                  version: 2
                  mime_type: application/epub+zip
                  size: 2457600
                  checksum_sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                  download_url: https://example.test/api/v1/media/10/download?expires=1794744300&signature=example
                  expires_at: '2026-11-15T12:05:00Z'
        '401':
          description: The access token is missing, invalid, or revoked.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: UNAUTHENTICATED
                  message: Authentication is required.
                  request_id: 01JD0EXAMPLE00000000000000
        '403':
          description: The authenticated account cannot access VIP content.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: CONTENT_ACCESS_DENIED
                  message: Your account cannot access this content.
                  request_id: 01JD0EXAMPLE00000000000000
        '404':
          description: The book is unavailable or has no active EPUB.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                bookNotFound:
                  value:
                    error:
                      code: BOOK_NOT_FOUND
                      message: The requested book was not found.
                      request_id: 01JD0EXAMPLE00000000000000
                epubNotFound:
                  value:
                    error:
                      code: EPUB_NOT_FOUND
                      message: No EPUB is available for this book.
                      request_id: 01JD0EXAMPLE00000000000000
  /media/{file}/download:
    get:
      tags:
        - EPUB
      summary: Download an EPUB through a temporary signed URL
      operationId: downloadEpub
      parameters:
        - name: file
          in: path
          required: true
          description: Opaque book-file identifier from the EPUB descriptor.
          schema:
            type: integer
            format: int64
        - name: expires
          in: query
          required: true
          description: Unix timestamp included in the signed URL.
          schema:
            type: integer
            format: int64
        - name: signature
          in: query
          required: true
          description: URL signature covering the path and expiry.
          schema:
            type: string
      responses:
        '200':
          description: The exact EPUB bytes streamed as an attachment.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Content-Length:
              description: EPUB size in bytes.
              schema:
                type: integer
                format: int64
            Content-Disposition:
              description: Attachment disposition with a server-generated safe filename.
              schema:
                type: string
                example: attachment; filename=book-1-v2.epub
            ETag:
              description: Quoted SHA-256 checksum stored with the EPUB metadata.
              schema:
                type: string
                example: '"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"'
          content:
            application/epub+zip:
              schema:
                type: string
                format: binary
        '403':
          description: The signed URL is missing, modified, or expired.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INVALID_MEDIA_SIGNATURE
                  message: The media signature is invalid or has expired.
                  request_id: 01JD0EXAMPLE00000000000000
        '404':
          description: The signed identifier no longer resolves to an active EPUB.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: EPUB_NOT_FOUND
                  message: No EPUB is available for this book.
                  request_id: 01JD0EXAMPLE00000000000000
  /genres:
    get:
      tags:
        - Catalog
      summary: List active genres
      operationId: listGenres
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Active genres with published book counts.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenreCollectionResponse'
              example:
                data:
                  - id: 1
                    slug: van-hoc-co-dien
                    name: Văn học cổ điển
                    published_book_count: 8
        '401':
          description: The access token is missing, invalid, or revoked.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: UNAUTHENTICATED
                  message: Authentication is required.
                  request_id: 01JD0EXAMPLE00000000000000
  /genres/{genre}/books:
    get:
      tags:
        - Catalog
      summary: List published books in an active genre
      operationId: listGenreBooks
      security:
        - bearerAuth: []
      parameters:
        - name: genre
          in: path
          required: true
          description: Numeric genre identifier or unique slug.
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Published books assigned to the active genre.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookCollectionResponse'
              example:
                data:
                  - id: 1
                    slug: truyen-kieu
                    title: Truyện Kiều
                    author:
                      id: 1
                      name: Nguyễn Du
                    country: Vietnam
                    access_level: free
                    status: published
                    average_rating: '4.90'
                    review_count: 1200
                    cover_url: null
                    has_epub: false
                    has_audiobook: false
                meta:
                  current_page: 1
                  per_page: 20
                  total: 1
                  last_page: 1
        '401':
          description: The access token is missing, invalid, or revoked.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: UNAUTHENTICATED
                  message: Authentication is required.
                  request_id: 01JD0EXAMPLE00000000000000
        '404':
          description: The genre is missing or inactive.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: NOT_FOUND
                  message: The requested resource was not found.
                  request_id: 01JD0EXAMPLE00000000000000
        '422':
          description: One or more pagination parameters are invalid.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: The request contains invalid fields.
                  fields:
                    per_page:
                      - The per page field must be between 1 and 50.
                  request_id: 01JD0EXAMPLE00000000000000
  /health:
    get:
      summary: Check application availability
      operationId: getHealth
      responses:
        '200':
          description: The application is available.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - status
                    properties:
                      status:
                        type: string
                        enum:
                          - ok
              example:
                data:
                  status: ok
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Opaque token
  headers:
    RequestId:
      description: Server-generated identifier used to correlate a response with logs.
      schema:
        type: string
        pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
  schemas:
    BookAuthorSummary:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    BookCollectionResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BookSummary'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    BookDetailResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/BookDetail'
    EpubDescriptorResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/EpubDescriptor'
    EpubDescriptor:
      type: object
      required:
        - file_id
        - book_id
        - version
        - mime_type
        - size
        - checksum_sha256
        - download_url
        - expires_at
      properties:
        file_id:
          type: integer
          format: int64
        book_id:
          type: integer
          format: int64
        version:
          type: integer
          minimum: 1
        mime_type:
          type: string
          enum:
            - application/epub+zip
        size:
          type: integer
          format: int64
          minimum: 1
        checksum_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        download_url:
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time
    BookDetail:
      allOf:
        - $ref: '#/components/schemas/BookSummary'
        - type: object
          required:
            - original_title
            - alternative_titles
            - original_language
            - publication_period
            - genres
            - structure
            - historical_setting
            - synopsis
            - keywords
            - available_content_types
          properties:
            original_title:
              type: string
              nullable: true
            alternative_titles:
              type: array
              items:
                type: string
            author:
              $ref: '#/components/schemas/BookAuthorDetail'
            original_language:
              type: string
              nullable: true
            publication_period:
              type: string
              nullable: true
            genres:
              type: array
              items:
                $ref: '#/components/schemas/Genre'
            structure:
              type: string
              nullable: true
            historical_setting:
              type: string
              nullable: true
            synopsis:
              type: string
            keywords:
              type: array
              items:
                type: string
            available_content_types:
              type: array
              items:
                type: string
                enum:
                  - epub
                  - audiobook
    BookAuthorDetail:
      allOf:
        - $ref: '#/components/schemas/BookAuthorSummary'
        - type: object
          required:
            - original_name
          properties:
            original_name:
              type: string
              nullable: true
    BookSummary:
      type: object
      required:
        - id
        - slug
        - title
        - author
        - country
        - access_level
        - status
        - average_rating
        - review_count
        - cover_url
        - has_epub
        - has_audiobook
      properties:
        id:
          type: integer
          format: int64
        slug:
          type: string
        title:
          type: string
        author:
          $ref: '#/components/schemas/BookAuthorSummary'
        country:
          type: string
        access_level:
          type: string
          enum:
            - free
            - vip
        status:
          type: string
          enum:
            - published
        average_rating:
          type: string
          pattern: '^\d+\.\d{2}$'
          example: '4.90'
        review_count:
          type: integer
          minimum: 0
        cover_url:
          type: string
          format: uri
          nullable: true
        has_epub:
          type: boolean
        has_audiobook:
          type: boolean
    Genre:
      type: object
      required:
        - id
        - slug
        - name
      properties:
        id:
          type: integer
          format: int64
        slug:
          type: string
        name:
          type: string
    GenreCollectionResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/GenreSummary'
    GenreSummary:
      allOf:
        - $ref: '#/components/schemas/Genre'
        - type: object
          required:
            - published_book_count
          properties:
            published_book_count:
              type: integer
              minimum: 0
    CurrentUserResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/User'
    LoginRequest:
      type: object
      required:
        - email
        - password
        - device_name
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          example: reader@example.com
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          writeOnly: true
          example: secret-password
        device_name:
          type: string
          minLength: 1
          maxLength: 100
          example: iPhone
    LoginResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - token
            - token_type
            - user
          properties:
            token:
              type: string
              description: Personal access token. This plain-text value is returned only when issued.
            token_type:
              type: string
              enum:
                - Bearer
            user:
              $ref: '#/components/schemas/User'
    PaginationMeta:
      type: object
      required:
        - current_page
        - per_page
        - total
        - last_page
      properties:
        current_page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
          maximum: 50
        total:
          type: integer
          minimum: 0
        last_page:
          type: integer
          minimum: 1
    RegisterRequest:
      type: object
      required:
        - full_name
        - username
        - birth_date
        - phone_number
        - email
        - password
        - password_confirmation
      properties:
        full_name:
          type: string
          minLength: 2
          maxLength: 100
        username:
          type: string
          minLength: 4
          maxLength: 20
          pattern: '^[A-Za-z0-9._]+$'
        birth_date:
          type: string
          format: date
        phone_number:
          type: string
          pattern: '^\+?[0-9]{9,15}$'
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          writeOnly: true
        password_confirmation:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          writeOnly: true
    RegisterResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - user
          properties:
            user:
              $ref: '#/components/schemas/User'
    User:
      type: object
      required:
        - id
        - full_name
        - username
        - birth_date
        - phone_number
        - email
        - role
      properties:
        id:
          type: integer
          format: int64
        full_name:
          type: string
        username:
          type: string
        birth_date:
          type: string
          format: date
        phone_number:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum:
            - reader
            - admin
    SuccessResponse:
      type: object
      required:
        - data
      properties:
        data: {}
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/Error'
    Error:
      type: object
      required:
        - code
        - message
        - request_id
      properties:
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]*$'
          example: NOT_FOUND
        message:
          type: string
          example: The requested resource was not found.
        fields:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            email:
              - The email field is required.
        request_id:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
          example: 01JD0EXAMPLE00000000000000
