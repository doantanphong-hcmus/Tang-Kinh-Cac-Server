openapi: 3.0.3
info:
  title: Tang Kinh Cac API
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /auth/login:
    post:
      tags:
        - Authentication
      summary: Log in and issue a personal access token
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: reader@example.com
              password: correct-horse-battery-staple
              device_name: Pixel 9
      responses:
        '200':
          description: Login successful
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                data:
                  token: 1|plain-text-token-returned-once
                  token_type: Bearer
                  user:
                    id: 1
                    full_name: Nguyen Van An
                    username: reader.one
                    birth_date: '1990-06-15'
                    phone_number: '+84901234567'
                    email: reader@example.com
                    role: reader
        '401':
          description: Invalid credentials
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INVALID_CREDENTIALS
                  message: The provided credentials are invalid.
                  request_id: 01JD0EXAMPLE00000000000000
        '422':
          description: Validation failed
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: The request contains invalid fields.
                  fields:
                    email:
                      - The email field must be a valid email address.
                  request_id: 01JD0EXAMPLE00000000000000
        '429':
          description: Too many failed login attempts
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: TOO_MANY_REQUESTS
                  message: Too many requests were made.
                  request_id: 01JD0EXAMPLE00000000000000
  /auth/me:
    get:
      tags:
        - Authentication
      summary: Get the authenticated user
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The authenticated user.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
              example:
                data:
                  id: 1
                  full_name: Nguyen Van An
                  username: reader.one
                  birth_date: '1990-06-15'
                  phone_number: '+84901234567'
                  email: reader@example.com
                  role: reader
        '401':
          description: The access token is missing, invalid, or revoked.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: UNAUTHENTICATED
                  message: Authentication is required.
                  request_id: 01JD0EXAMPLE00000000000000
  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Revoke the current access token
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        '204':
          description: The current access token was revoked.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
        '401':
          description: The access token is missing, invalid, or revoked.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: UNAUTHENTICATED
                  message: Authentication is required.
                  request_id: 01JD0EXAMPLE00000000000000
  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register a reader account
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              full_name: Nguyen Van An
              username: reader.one
              birth_date: '1990-06-15'
              phone_number: '+84901234567'
              email: reader@example.com
              password: correct-horse-battery-staple
              password_confirmation: correct-horse-battery-staple
      responses:
        '201':
          description: The reader account was created without authenticating it.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
              example:
                data:
                  user:
                    id: 1
                    full_name: Nguyen Van An
                    username: reader.one
                    birth_date: '1990-06-15'
                    phone_number: '+84901234567'
                    email: reader@example.com
                    role: reader
        '409':
          description: The normalized email address or username is already used.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                emailAlreadyUsed:
                  value:
                    error:
                      code: EMAIL_ALREADY_USED
                      message: The email address has already been used.
                      request_id: 01JD0EXAMPLE00000000000000
                usernameAlreadyUsed:
                  value:
                    error:
                      code: USERNAME_ALREADY_USED
                      message: The username has already been used.
                      request_id: 01JD0EXAMPLE00000000000000
        '422':
          description: One or more registration fields are invalid.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: The request contains invalid fields.
                  fields:
                    email:
                      - The email field must be a valid email address.
                  request_id: 01JD0EXAMPLE00000000000000
        '429':
          description: Too many registration attempts were made.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: TOO_MANY_REQUESTS
                  message: Too many requests were made.
                  request_id: 01JD0EXAMPLE00000000000000
  /health:
    get:
      summary: Check application availability
      operationId: getHealth
      responses:
        '200':
          description: The application is available.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - status
                    properties:
                      status:
                        type: string
                        enum:
                          - ok
              example:
                data:
                  status: ok
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Opaque token
  headers:
    RequestId:
      description: Server-generated identifier used to correlate a response with logs.
      schema:
        type: string
        pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
  schemas:
    CurrentUserResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/User'
    LoginRequest:
      type: object
      required:
        - email
        - password
        - device_name
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          example: reader@example.com
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          writeOnly: true
          example: secret-password
        device_name:
          type: string
          minLength: 1
          maxLength: 100
          example: iPhone
    LoginResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - token
            - token_type
            - user
          properties:
            token:
              type: string
              description: Personal access token. This plain-text value is returned only when issued.
            token_type:
              type: string
              enum:
                - Bearer
            user:
              $ref: '#/components/schemas/User'
    RegisterRequest:
      type: object
      required:
        - full_name
        - username
        - birth_date
        - phone_number
        - email
        - password
        - password_confirmation
      properties:
        full_name:
          type: string
          minLength: 2
          maxLength: 100
        username:
          type: string
          minLength: 4
          maxLength: 20
          pattern: '^[A-Za-z0-9._]+$'
        birth_date:
          type: string
          format: date
        phone_number:
          type: string
          pattern: '^\+?[0-9]{9,15}$'
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          writeOnly: true
        password_confirmation:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          writeOnly: true
    RegisterResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - user
          properties:
            user:
              $ref: '#/components/schemas/User'
    User:
      type: object
      required:
        - id
        - full_name
        - username
        - birth_date
        - phone_number
        - email
        - role
      properties:
        id:
          type: integer
          format: int64
        full_name:
          type: string
        username:
          type: string
        birth_date:
          type: string
          format: date
        phone_number:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum:
            - reader
            - admin
    SuccessResponse:
      type: object
      required:
        - data
      properties:
        data: {}
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/Error'
    Error:
      type: object
      required:
        - code
        - message
        - request_id
      properties:
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]*$'
          example: NOT_FOUND
        message:
          type: string
          example: The requested resource was not found.
        fields:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            email:
              - The email field is required.
        request_id:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
          example: 01JD0EXAMPLE00000000000000
